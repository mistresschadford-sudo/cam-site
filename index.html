
<!DOCTYPE html> 
<html lang="en"> 
<head> <link rel="icon" type="image/png" href="/favicon.png">
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Tina Chadford Scheduling</title> 
<link href="/style.css" rel="stylesheet" type="text/css" media="all"> 
<style> 
body { background-color: #050108; margin: 0; padding: 20px; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; background-image: radial-gradient(circle at 50% 30%, #4a002a 0%, #050108 70%); animation: ambientGlow 8s infinite ease-in-out; overflow-x: hidden; } 
.fade-in-content { opacity: 0; transform: translateY(15px); animation: pageEntrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; display: flex; flex-direction: column; align-items: center; width: 100%; } 
.hypno-status-box { background-color: rgba(15, 5, 12, 0.95); border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; text-align: center; color: #ffffff; box-sizing: border-box; transition: all 0.3s ease; margin: 0 auto 20px auto; backdrop-filter: blur(5px); } 
.status-header { font-size: 20px; letter-spacing: 4px; color: #ff66b2; margin-bottom: 24px; border-bottom: 2px dashed #800040; padding-bottom: 10px; } 
.status-body { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; } 
.status-text-wrapper { text-align: center; } 
@media (min-width: 400px) { .status-text-wrapper { text-align: left; } } 
.status-label { font-weight: bold; font-size: 32px; letter-spacing: 2px; } 
.status-subtext { margin: 8px 0 0 0; font-size: 18px; line-height: 1.4; } 
.status-pic { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; display: none; } 
.session-container { width: 100%; max-width: 500px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; margin: 10px auto 20px auto; } 
.session-btn { background-color: rgba(20, 5, 15, 0.8); border: 2px solid #ff007f; color: #ffffff; padding: 16px; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; letter-spacing: 1px; border-radius: 8px; cursor: pointer; text-decoration: none; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 10px rgba(255, 0, 127, 0.2); transition: all 0.2s ease-in-out; } 
.session-price { color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.4); } 
.session-btn:hover { background-color: #ff007f; color: #050108; box-shadow: 0 0 20px rgba(255, 0, 127, 0.7); transform: scale(1.02); } 
.session-btn:hover .session-price { color: #050108; text-shadow: none; } 
.hypno-status-box.online { border: 4px solid #ff007f; box-shadow: 0 0 30px rgba(255, 0, 127, 0.4); } 
.hypno-status-box.online .pic-online { display: block; border: 2px solid #00ffcc; animation: pulseGlow 2.5s infinite ease-in-out; } 
.hypno-status-box.online .pic-offline { display: none; } 
.hypno-status-box.online .status-label::before { content: "ONLINE"; color: #00ffcc; text-shadow: 0 0 16px rgba(0, 255, 204, 0.6); } 
.hypno-status-box.online .status-subtext::before { content: "Hurry before I get booked up ;)"; color: #ff99cc; } 
.hypno-status-box.offline { border: 4px solid #333333; box-shadow: none; opacity: 0.7; } 
.hypno-status-box.offline .pic-offline { display: block; border: 2px solid #ff3333; } 
.hypno-status-box.offline .pic-online { display: none; } 
.hypno-status-box.offline .status-label::before { content: "OFFLINE"; color: #ff3333; text-shadow: 0 0 16px rgba(255, 51, 51, 0.5); } 
.hypno-status-box.offline .status-subtext::before { content: "Back again soon!"; color: #8c8c8c; } 
@keyframes pageEntrance { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } } 
@keyframes ambientGlow { 0% { background-image: radial-gradient(circle at 50% 30%, #4a002a 0%, #050108 70%); } 50% { background-image: radial-gradient(circle at 50% 35%, #66003a 0%, #050108 65%); } 100% { background-image: radial-gradient(circle at 50% 30%, #4a002a 0%, #050108 70%); } } 
@keyframes pulseGlow { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); } 50% { transform: scale(1.06); box-shadow: 0 0 36px rgba(255, 0, 127, 0.8); border-color: #ff007f; } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 0, 0.4); } } 
</style> 
</head> 
<body> 

<div class="fade-in-content"> 
  
  <div class="hypno-status-box"> 
    <div class="status-header">STATUS</div> 
    <div class="status-body"> 
      <img class="status-pic pic-online" src="tinaprofilesq.png" alt="TinaChadford"> 
      <img class="status-pic pic-offline" src="OFFLINEHEART.jpg" alt="offline"> 
      <div class="status-text-wrapper"> 
        <span class="status-label"></span> 
        <p class="status-subtext"></p> 
      </div> 
    </div> 
  </div> 

  <!-- SESSION BUTTONS BLOCK WITH PRICING -->
  <div class="session-container"> 
    <a href="https://mintstars.com/tip/mistresschadford?a=4321" class="session-btn"><span>10 Minute Session</span><span class="session-price">$50</span></a> 
    <a href="https://mintstars.com/tip/mistresschadford?a=8669" class="session-btn"><span>20 Minute Session</span><span class="session-price">$100</span></a> 
    <a href="https://mintstars.com/tip/mistresschadford?a=13017" class="session-btn"><span>30 Minute Session</span><span class="session-price">$150</span></a> 
  </div> 

  <iframe
    id="session-form-iframe"
    src="https://sparkly-tinachadfordemail.netlify.app/"
    title="Session Request Form"
    style="width: 100%; max-width: 500px; height: 480px; border: none; display: block; margin: 0 auto;"
    loading="lazy">
  </iframe>

</div> 

<script>
  (function () {
    var statusBox = document.querySelector('.hypno-status-box');
    if (!statusBox) return;

    fetch('/status.txt?_=' + Date.now())
      .then(function (response) {
        if (!response.ok) throw new Error('status.txt not found');
        return response.text();
      })
      .then(function (text) {
        var lines = text.trim().split('\n');
        var status = (lines[0] || '').trim().toLowerCase();

        if (status === 'online' || status === 'offline') {
          statusBox.classList.remove('online', 'offline');
          statusBox.classList.add(status);
        }

        // Sync the iframe form with the fetched status, same as before
        var formIframe = document.getElementById('session-form-iframe');
        if (formIframe && status === 'offline') {
          formIframe.src = formIframe.src + '?status=offline';
        }
      })
      .catch(function (err) {
        console.error('Could not load status:', err);
      });
  })();
</script>
</body> 
</html>
